# Keeps the Supabase free-tier project from being paused for inactivity.
# Supabase pauses free projects after ~7 days without requests, which would
# break sign-in, the devlog and the newsletter. This pings the API every
# 3 days (max gap well under 7). If the ping fails, the run fails and
# GitHub emails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPA_URL: https://xemwnccaqxnttrabdayh.supabase.co
      # Public anon key (already shipped in script.js), not a secret.
      SUPA_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlbXduY2NhcXhudHRyYWJkYXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTczMTksImV4cCI6MjEwNjAzMzMxOX0.mawkXgP9IrL0_Yhj3OiW94v6LwthNrzJfFIwsUVRCIM
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "$SUPA_URL/rest/v1/games?select=id&limit=1" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY" \
            -o /dev/null
          echo "Supabase responded OK at $(date -u +%FT%TZ)"
