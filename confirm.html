<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Double Trouble Studios</title>
  <link rel="icon" href="logo.jpg">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="brand">
      <img src="logo.jpg" alt="">
      <span>DOUBLE TROUBLE <em>STUDIOS</em></span>
    </a>
  </nav>

  <main class="confirm-wrap">
    <img src="logo.jpg" alt="Double Trouble Studios">
    <p class="eyebrow" id="confirm-eyebrow">One moment</p>
    <h1 id="confirm-title">Verifying...</h1>
    <p id="confirm-desc">Checking your link.</p>
    <a href="index.html" class="btn btn-primary">Back to site</a>
  </main>

  <footer class="footer">
    <span>&copy; 2026 Double Trouble Studios</span>
  </footer>

  <script>
    const SUPA_URL = "https://xemwnccaqxnttrabdayh.supabase.co";
    const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlbXduY2NhcXhudHRyYWJkYXloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTczMTksImV4cCI6MjEwNjAzMzMxOX0.mawkXgP9IrL0_Yhj3OiW94v6LwthNrzJfFIwsUVRCIM";
    const db = supabase.createClient(SUPA_URL, SUPA_KEY);
    const SESSION_KEY = "dts_session";

    function setResult(eyebrow, title, desc) {
      document.getElementById("confirm-eyebrow").textContent = eyebrow;
      document.getElementById("confirm-title").textContent = title;
      document.getElementById("confirm-desc").textContent = desc;
    }

    async function handleUnsubscribe(unsubToken) {
      setResult("Unsubscribing", "One moment...", "Removing you from the list.");
      const { data, error } = await db.rpc("unsubscribe", { token_input: unsubToken });

      if (error || data !== true) {
        setResult("Unsubscribe", "Link expired", "This unsubscribe link is invalid or was already used.");
        return;
      }

      try { localStorage.removeItem(SESSION_KEY); } catch {}
      setResult("Unsubscribed", "You're off the list", "Sorry to see you go. You can always join again from the main page.");
    }

    async function handleMagicLink(token) {
      const { data, error } = await db.rpc("verify_magic_link", { token_input: token });

      if (error || !data || !data.ok) {
        setResult("Email verification", "Link expired", "This link is invalid or was already used. Head back to the main page to get a new one.");
        return;
      }

      try {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          email: data.email,
          session_token: data.session_token,
        }));
      } catch { /* private mode — session just won't persist across visits */ }

      if (data.welcome) {
        setResult("Email verification", "You're in! 🎮", "Your email is confirmed and you're signed in on this device. Welcome aboard — devlogs and early access news are coming your way.");
      } else {
        setResult("Signed in", "Welcome back! 🎮", "You're signed in on this device. Head back to the site to see what's new.");
      }
    }

    async function run() {
      const params = new URLSearchParams(location.search);
      const unsubToken = params.get("unsub");
      const token = params.get("token");

      if (unsubToken) {
        await handleUnsubscribe(unsubToken);
        return;
      }

      if (!token) {
        setResult("Invalid link", "Invalid link", "This link is missing its token. Please use the link from your email.");
        return;
      }

      await handleMagicLink(token);
    }

    run();
  </script>
</body>
</html>
